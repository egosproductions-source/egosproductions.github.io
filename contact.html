    <!-- =========================================
         CONTACT PAGE CSS

    <style>

        /* =========================================
           PAGE
           ========================================= */

        .contact-page {
            margin: 0;
            padding: 0;
        }


        /* =========================================
           INTERNAL HERO
           ========================================= */

        .egos-internal-hero {
            position: relative;

            width: 100%;
            height: 320px;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0;
            padding: 0;
        }


        .egos-internal-hero-bg {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            z-index: 0;
        }


        .egos-internal-hero::after {
            content: "";

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.3);

            z-index: 1;
        }


        .egos-internal-hero-content {
            position: relative;

            z-index: 2;

            width: 100%;

            text-align: center;
        }


        .egos-internal-hero-content h2 {
            position: relative;

            display: inline-block;

            margin: 0;

            color: #fff;

            font-size: 60px;
            line-height: 1;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 2px;
        }


        .egos-internal-hero-content h2 span {
            position: absolute;

            left: 50%;
            top: 0;

            transform: translateX(-50%);

            width: 100%;

            color: transparent;

            -webkit-text-stroke: 1px rgba(255,255,255,0.25);

            z-index: -1;
        }


        /* =========================================
           CONTACT FEATURED AREA
           ========================================= */

        .egos-contact-featured {
            position: relative;

            width: 100%;

            padding: 75px 0;

            margin: 0;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.58),
                    rgba(0, 0, 0, 0.58)
                ),
                url('images/g9.jpg');

            background-size: cover;

            background-position: center;

            background-attachment: fixed;
        }


        .egos-contact-featured .section-heading {
            margin-bottom: 35px;
        }


        .egos-contact-featured .section-heading h2 {
            color: #fff;
        }


        /* =========================================
           FEATURED IMAGE
           ========================================= */

        .egos-contact-featured-image {
            position: relative;

            width: 100%;

            max-width: 1050px;

            margin: 0 auto;

            overflow: hidden;

            background: #000;
        }


        .egos-contact-featured-image img {
            display: block;

            width: 100%;

            height: 430px;

            object-fit: cover;

            opacity: 0.72;
        }


        .egos-contact-featured-overlay {
            position: absolute;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 30px;
        }


        .egos-contact-featured-overlay h2 {
            margin: 0 0 12px;

            color: #fff;

            font-size: 48px;

            line-height: 1.1;

            font-weight: 700;

            letter-spacing: 2px;
        }


        .egos-contact-featured-overlay p {
            margin: 0;

            color: rgba(255,255,255,0.9);

            font-size: 16px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }


        /* =========================================
           CONTACT INFORMATION
           ========================================= */

        .egos-contact-links {
            margin-top: 35px;
        }


        .egos-contact-card {
            height: 100%;

            padding: 35px 20px;

            text-align: center;

            background: rgba(0,0,0,0.55);

            border: 1px solid rgba(255,255,255,0.15);

            box-sizing: border-box;
        }


        .egos-contact-icon {
            margin-bottom: 15px;

            font-size: 30px;

            color: #fff;
        }


        .egos-contact-card h5 {
            margin: 0 0 12px;

            color: #fff;

            font-size: 20px;

            font-weight: 600;
        }


        .egos-contact-card p {
            margin: 0;

            color: rgba(255,255,255,0.8);

            font-size: 14px;

            line-height: 1.6;
        }


        .egos-contact-card a {
            color: #fff;

            text-decoration: none;

            transition: opacity 0.3s ease;
        }
